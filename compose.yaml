services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: superkart_backend
    ports:
      - "7860:7860"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: superkart_frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
